<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="時光詩箋・四季塔羅 Chronicles of Seasons Emblem">
  <defs>
    <radialGradient id="chronicleBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1D2944"/>
      <stop offset="100%" stop-color="#0D1422"/>
    </radialGradient>
    <linearGradient id="chronicleGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E8BD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7830"/>
    </linearGradient>
    <linearGradient id="springPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FADADD"/>
      <stop offset="100%" stop-color="#DE9AA4"/>
    </linearGradient>
    <linearGradient id="autumnGinkgoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7A684"/>
      <stop offset="100%" stop-color="#BC6D4D"/>
    </linearGradient>
    <linearGradient id="winterFrostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF5F9"/>
      <stop offset="100%" stop-color="#8FA9BA"/>
    </linearGradient>
  </defs>

  <!-- Deep Midnight Seal Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#chronicleBgGrad)"/>

  <!-- Double Gold Foil Border -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="22.5" fill="none" stroke="url(#chronicleGoldGrad)" stroke-width="1.5"/>
  <rect x="15" y="15" width="98" height="98" rx="17.5" fill="none" stroke="url(#chronicleGoldGrad)" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- Seasonal Orbital Wheel & Diagonal Window Dividers -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#chronicleGoldGrad)" stroke-width="0.9" stroke-opacity="0.55"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#chronicleGoldGrad)" stroke-width="0.8" stroke-dasharray="2.5 3.5" stroke-opacity="0.62"/>
  <circle cx="64" cy="64" r="15" fill="none" stroke="url(#chronicleGoldGrad)" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="34" y1="34" x2="94" y2="94" stroke="url(#chronicleGoldGrad)" stroke-width="0.75" stroke-opacity="0.34"/>
  <line x1="94" y1="34" x2="34" y2="94" stroke="url(#chronicleGoldGrad)" stroke-width="0.75" stroke-opacity="0.34"/>

  <!-- NORTH (Spring): Notched Sakura Blossom Petal & Delicate Stamen -->
  <g transform="translate(64, 30)">
    <path d="M 0 11 C -9 6, -11 -4, -3.5 -9.5 L 0 -5 L 3.5 -9.5 C 11 -4, 9 6, 0 11 Z" fill="url(#springPetalGrad)" stroke="#F7E8BD" stroke-width="0.7"/>
    <line x1="0" y1="7" x2="0" y2="-1" stroke="#FFF8F8" stroke-width="0.8" stroke-opacity="0.75"/>
    <circle cx="-6" cy="-5" r="1.2" fill="#FADADD" fill-opacity="0.85"/>
    <circle cx="6.5" cy="-4" r="1" fill="#FADADD" fill-opacity="0.7"/>
  </g>

  <!-- EAST (Summer): Radiant Crescent Moon & Companion Stars -->
  <g transform="translate(97, 64)">
    <path d="M 4 -9 C -3.5 -8.5, -7.5 -3, -7 3 C -6.5 8.5, -1 11, 5.5 9.2 C 0 8.2, -1.8 4, -1.8 0 C -1.8 -4.2, 0 -7.5, 4 -9 Z" fill="url(#chronicleGoldGrad)"/>
    <polygon points="5,-3 5.8,-0.8 8,0 5.8,0.8 5,3 4.2,0.8 2,0 4.2,-0.8" fill="#F7E8BD"/>
    <circle cx="5" cy="5.5" r="1.1" fill="#F7E8BD" fill-opacity="0.8"/>
  </g>

  <!-- SOUTH (Autumn): Fan-Shaped Ginkgo Leaf in Warm Amber -->
  <g transform="translate(64, 98)">
    <line x1="0" y1="9" x2="0" y2="2" stroke="#E7A684" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 0 3.5 C -9 1.5, -11 -6.5, -2.5 -8.5 L 0 -4 L 2.5 -8.5 C 11 -6.5, 9 1.5, 0 3.5 Z" fill="url(#autumnGinkgoGrad)" stroke="#F7E8BD" stroke-width="0.65"/>
    <line x1="0" y1="2.5" x2="-3.5" y2="-4.5" stroke="#FFF4EB" stroke-width="0.6" stroke-opacity="0.6"/>
    <line x1="0" y1="2.5" x2="3.5" y2="-4.5" stroke="#FFF4EB" stroke-width="0.6" stroke-opacity="0.6"/>
  </g>

  <!-- WEST (Winter): Symmetrical Six-Fold Frost Crystal -->
  <g transform="translate(30, 64)" stroke="url(#winterFrostGrad)" stroke-width="1.25" stroke-linecap="round">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-7.8" y1="-4.5" x2="7.8" y2="4.5"/>
    <line x1="7.8" y1="-4.5" x2="-7.8" y2="4.5"/>
    <!-- Crystal barbs -->
    <polyline points="-2.5,-6 0,-3.8 2.5,-6" fill="none" stroke-width="0.9"/>
    <polyline points="-2.5,6 0,3.8 2.5,6" fill="none" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="1.8" fill="#EDF5F9" stroke="none"/>
  </g>

  <!-- Centerpiece: Four-Pointed Polar Compass Star Uniting the Seasons -->
  <polygon points="64,51 66.8,61.2 77,64 66.8,66.8 64,77 61.2,66.8 51,64 61.2,61.2" fill="url(#chronicleGoldGrad)"/>
  <circle cx="64" cy="64" r="2.6" fill="#1D2944"/>
  <circle cx="64" cy="64" r="1.3" fill="#F7E8BD"/>
</svg>

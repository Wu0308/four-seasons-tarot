<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="四時詩籤・謐夜塔羅 Emblem">
  <defs>
    <radialGradient id="oracleBgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1C2742"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </radialGradient>
    <linearGradient id="oracleGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5B8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7B34"/>
    </linearGradient>
    <linearGradient id="oracleSoftGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F5E5B8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Deep Midnight Seal Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#oracleBgGrad)"/>

  <!-- Double Champagne Gold Foil Borders -->
  <rect x="9" y="9" width="110" height="110" rx="23" fill="none" stroke="url(#oracleGoldGrad)" stroke-width="1.6"/>
  <rect x="14.5" y="14.5" width="99" height="99" rx="18" fill="none" stroke="url(#oracleSoftGold)" stroke-width="0.8"/>

  <!-- Subtle Inner Tarot Arch Frame -->
  <path d="M 24 104 V 52 C 24 30, 104 30, 104 52 V 104 Z" fill="#D4AF37" fill-opacity="0.04" stroke="url(#oracleGoldGrad)" stroke-width="0.9" stroke-opacity="0.55"/>

  <!-- Astrolabe Degree Ring & Crosshairs -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="url(#oracleGoldGrad)" stroke-width="0.9" stroke-dasharray="2.5 3.5" stroke-opacity="0.72"/>
  <circle cx="64" cy="64" r="27" fill="none" stroke="url(#oracleGoldGrad)" stroke-width="0.75" stroke-opacity="0.45"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="url(#oracleGoldGrad)" stroke-width="0.65" stroke-opacity="0.32"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="url(#oracleGoldGrad)" stroke-width="0.65" stroke-opacity="0.32"/>

  <!-- Diagonal Astrolabe Ticks -->
  <line x1="38" y1="38" x2="44" y2="44" stroke="url(#oracleGoldGrad)" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="90" y1="38" x2="84" y2="44" stroke="url(#oracleGoldGrad)" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="38" y1="90" x2="44" y2="84" stroke="url(#oracleGoldGrad)" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="90" y1="90" x2="84" y2="84" stroke="url(#oracleGoldGrad)" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Four Seasonal Cardinal Motifs -->
  <!-- North: Spring Blossom Bud -->
  <path d="M 64 21 C 61 25, 61 29, 64 31 C 67 29, 67 25, 64 21 Z" fill="url(#oracleGoldGrad)"/>
  <!-- East: Summer Sun Ray -->
  <polygon points="103,64 98,62 96,64 98,66" fill="url(#oracleGoldGrad)"/>
  <circle cx="105" cy="64" r="1.4" fill="url(#oracleGoldGrad)"/>
  <!-- South: Autumn Ginkgo Diamond -->
  <path d="M 64 98 L 68 103 C 66 105, 62 105, 60 103 Z" fill="url(#oracleGoldGrad)"/>
  <!-- West: Winter Frost Crystal -->
  <g stroke="url(#oracleGoldGrad)" stroke-width="1" stroke-linecap="round">
    <line x1="21" y1="64" x2="29" y2="64"/>
    <line x1="25" y1="60" x2="25" y2="68"/>
  </g>

  <!-- Central Interlocking Crescent Moon -->
  <path d="M 70 43 C 54 44, 44 55, 44 67 C 44 80, 56 89, 71 87 C 59 83, 55 74, 55 64 C 55 54, 60 46, 70 43 Z" fill="url(#oracleGoldGrad)" fill-opacity="0.92"/>
  <path d="M 70 43 C 54 44, 44 55, 44 67 C 44 80, 56 89, 71 87" fill="none" stroke="#F5E5B8" stroke-width="0.9" stroke-opacity="0.7"/>

  <!-- Central Eight-Pointed Polar Star -->
  <polygon points="71,49 73.2,61.8 86,64 73.2,66.2 71,79 68.8,66.2 56,64 68.8,61.8" fill="url(#oracleGoldGrad)"/>
  <polygon points="71,55 72.1,62.4 79.5,64 72.1,65.6 71,73 69.9,65.6 62.5,64 69.9,62.4" fill="#121A2B" fill-opacity="0.45"/>
  <circle cx="71" cy="64" r="2.2" fill="#F5E5B8"/>
</svg>
